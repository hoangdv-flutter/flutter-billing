name: flutter_billing
description: Lớp mua hàng trong app (IAP) dùng chung — bọc `in_app_purchase`.
version: 0.1.0
publish_to: 'none' # có path dependency (flutter_core) nên không đẩy pub.dev
homepage:

# KHÔNG còn là plugin. Bản 0.0.1 sinh ra từ `flutter create --template=plugin`
# nên kéo theo android/ + ios/ chỉ để trả về `getPlatformVersion` — thứ không ai
# gọi. Đống đó ghim AGP 7.3 / compileSdk 31 / minSdk 16, đủ để làm vỡ build của
# app dùng AGP 9. Toàn bộ việc native thật đã nằm trong `in_app_purchase`.
environment:
  sdk: '>=3.4.1 <4.0.0'
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  # 3.3.0: iOS mặc định chạy StoreKit 2 (từ in_app_purchase_storekit 0.4.0).
  in_app_purchase: ^3.3.0
  # Dùng trực tiếp trong `billing_repository.dart` (consumePurchase). Bản 0.0.1
  # import mà KHÔNG khai báo — chạy được nhờ transitive, nhưng `pub` cảnh báo và
  # sẽ gãy ngay khi in_app_purchase đổi cây phụ thuộc.
  in_app_purchase_android: ^0.5.3
  # Dùng trong `signature_checker.dart` — cũng thiếu khai báo ở bản 0.0.1.
  package_info_plus: any
  injectable: ^2.7.0
  rxdart: ^0.27.7
  flutter_core:
    path: ../flutter_core
  get_it: ^8.0.0
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^2.7.0
  build_runner: ^2.4.0

flutter:

# Chỉ có tác dụng khi flutter_billing là package gốc (chạy build_runner/test
# ngay trong package này). App dùng nó thì override ở pubspec.yaml của app mới
# là cái quyết định.
#
# flutter_core còn ghim `get_it: ^7.2.0` trong khi injectable 2.7 và app đều
# chạy get_it 8. Gỡ dòng này KHI flutter_core nâng lên `^8.0.0`.
dependency_overrides:
  get_it: ^8.0.0
